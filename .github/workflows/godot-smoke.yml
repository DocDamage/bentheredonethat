name: Godot smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A full isolated suite is intentionally a milestone gate. Keep only the newest
# relevant PR run active so documentation/evidence updates cannot accumulate
# parallel hour-long Windows jobs.
concurrency:
  group: godot-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-validation:
    name: Browser checks and asset validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install manifest validator dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Materialize visual profile contact sheet
        run: python tools/build_visual_profile_contact_sheet.py

      - name: Run browser checks
        run: npm run check

      - name: Validate clean-checkout runtime assets
        run: npm run validate:runtime-assets

  isolated-smoke:
    name: Isolated Godot smoke (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Restore LFS explicitly below. On hosted Windows, checkout's
          # implicit LFS fetch can leave pointer files in the worktree even
          # when its object download succeeds.
          lfs: false

      - name: Materialize runtime LFS assets
        shell: pwsh
        run: |
          git lfs pull --include="game/**"
          $pointers = Get-ChildItem -LiteralPath 'game' -Recurse -File |
            Where-Object {
              $_.Length -lt 200 -and
              ((Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue) -like 'version https://git-lfs.github.com/spec/v1*')
            }
          if ($pointers) {
            throw "Git LFS pointers remain in the runtime tree: $($pointers.FullName -join '; ')"
          }

      - name: Download Godot 4.7.1
        shell: pwsh
        run: |
          $release = '4.7.1-stable'
          $archive = Join-Path $env:RUNNER_TEMP "Godot_v${release}_win64.exe.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          $url = "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $godot = Get-ChildItem -LiteralPath $destination -Recurse -Filter 'Godot_v4.7.1-stable_win64_console.exe' |
            Select-Object -First 1
          if ($null -eq $godot) {
            throw 'The downloaded Godot archive did not contain the expected Windows console executable.'
          }
          "GODOT_EXECUTABLE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap project global-class cache
        shell: pwsh
        run: |
          # Dialogic's editor plugin is not part of the runtime contract, but
          # Godot loads it during a project import.  The supplied editor assets
          # contain stale UID references in a clean checkout, so disable only
          # editor plugins for this headless class-cache import.  The runtime
          # autoload and every isolated smoke scene keep their normal project
          # configuration.
          $project = 'game/project.godot'
          $content = Get-Content -LiteralPath $project -Raw
          $content = [regex]::Replace($content, '(?m)^enabled=PackedStringArray\([^\r\n]*\)$', 'enabled=PackedStringArray()')
          Set-Content -LiteralPath $project -Value $content -NoNewline -Encoding utf8
          # A clean checkout needs both its global class cache and imported
          # runtime resources. Killing the editor as soon as the class cache
          # appears races texture/font/audio and UID imports, which makes valid
          # files report "No loader found" in the isolated scenes. Wait until
          # the imported tree has reached its expected floor and stayed idle.
          $bootstrap = Start-Process -FilePath $env:GODOT_EXECUTABLE -ArgumentList @('--headless', '--path', './game', '--editor') -PassThru -NoNewWindow
          $deadline = (Get-Date).AddMinutes(20)
          $settled = $false
          do {
            Start-Sleep -Seconds 3
            $cacheReady = Test-Path -LiteralPath 'game/.godot/global_script_class_cache.cfg' -PathType Leaf
            $imported = @(Get-ChildItem -LiteralPath 'game/.godot/imported' -File -Recurse -ErrorAction SilentlyContinue)
            $latestImport = $imported | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($cacheReady -and $imported.Count -ge 1000 -and $latestImport -and $latestImport.LastWriteTime -lt (Get-Date).AddSeconds(-15)) {
              $settled = $true
              break
            }
          } while ((Get-Date) -lt $deadline -and -not $bootstrap.HasExited)
          if (-not $bootstrap.HasExited) {
            Stop-Process -Id $bootstrap.Id -Force
            $bootstrap.WaitForExit()
          }
          if (-not $settled) {
            throw 'Godot did not finish its clean-checkout class-cache and runtime-resource imports within 20 minutes.'
          }

      - name: Run isolated smoke suite shard
        shell: pwsh
        run: |
          $allScenes = @(Get-ChildItem 'game/tests' -Filter '*_smoke.tscn' -File | Sort-Object Name)
          $half = [Math]::Ceiling($allScenes.Count / 2.0)
          $selectedScenes = if (${{ matrix.shard }} -eq 0) {
            @($allScenes | Select-Object -First $half)
          } else {
            @($allScenes | Select-Object -Skip $half)
          }
          if ($selectedScenes.Count -eq 0) { throw 'Smoke shard is empty.' }
          $scenePaths = @($selectedScenes | ForEach-Object { 'tests/' + $_.Name })
          ./tools/run_godot_isolated.ps1 -GodotExecutable "$env:GODOT_EXECUTABLE" -Scene $scenePaths -TimeoutSeconds 240

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: test-artifacts
          if-no-files-found: warn
          retention-days: 14

  release-candidate-export:
    name: Clean Windows release candidate
    if: github.event_name == 'workflow_dispatch'
    needs: [browser-validation, isolated-smoke]
    runs-on: windows-latest
    # A clean runner imports the complete release asset set before exporting.
    # Keep this bounded, but allow enough time for that one-time import plus
    # packaging and the isolated executable launch check.
    timeout-minutes: 90

    steps:
      - name: Check out source and runtime assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot and matching export templates
        shell: pwsh
        run: |
          $release = '4.7.1-stable'
          $godotArchive = Join-Path $env:RUNNER_TEMP "Godot_v${release}_win64.exe.zip"
          $templateArchive = Join-Path $env:RUNNER_TEMP "Godot_v${release}_export_templates.tpz"
          $godotDirectory = Join-Path $env:RUNNER_TEMP 'godot'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_win64.exe.zip" -OutFile $godotArchive
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_export_templates.tpz" -OutFile $templateArchive
          Expand-Archive -LiteralPath $godotArchive -DestinationPath $godotDirectory -Force
          $templateStage = Join-Path $env:RUNNER_TEMP 'templates'
          $templateZip = "$templateArchive.zip"
          Copy-Item -LiteralPath $templateArchive -Destination $templateZip
          Expand-Archive -LiteralPath $templateZip -DestinationPath $templateStage -Force
          $templateTarget = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable'
          New-Item -ItemType Directory -Force -Path $templateTarget | Out-Null
          Copy-Item -LiteralPath (Join-Path $templateStage 'templates\windows_release_x86_64.exe') -Destination $templateTarget
          Copy-Item -LiteralPath (Join-Path $templateStage 'templates\windows_debug_x86_64.exe') -Destination $templateTarget
          $godot = Get-ChildItem -LiteralPath $godotDirectory -Recurse -Filter 'Godot_v4.7.1-stable_win64_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot console executable was not found.' }
          "GODOT_EXECUTABLE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and launch unsigned release candidate
        shell: pwsh
        run: ./tools/build_windows_release.ps1 -GodotExecutable "$env:GODOT_EXECUTABLE"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate-${{ github.run_id }}
          path: output/windows
          if-no-files-found: error
          retention-days: 14
