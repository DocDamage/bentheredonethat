name: Godot smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-validation:
    name: Browser checks and asset validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install manifest validator dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run browser checks
        run: npm run check

      - name: Validate clean-checkout runtime assets
        run: npm run validate:runtime-assets

  isolated-smoke:
    name: Isolated Godot smoke
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot 4.7.1
        shell: pwsh
        run: |
          $release = '4.7.1-stable'
          $archive = Join-Path $env:RUNNER_TEMP "Godot_v${release}_win64.exe.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          $url = "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $godot = Get-ChildItem -LiteralPath $destination -Recurse -Filter 'Godot_v4.7.1-stable_win64_console.exe' |
            Select-Object -First 1
          if ($null -eq $godot) {
            throw 'The downloaded Godot archive did not contain the expected Windows console executable.'
          }
          "GODOT_EXECUTABLE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import project global classes
        shell: pwsh
        run: >
          & "$env:GODOT_EXECUTABLE"
          --headless
          --path ./game
          --import

      - name: Run isolated smoke suite
        shell: pwsh
        run: >
          ./tools/run_godot_isolated.ps1
          -GodotExecutable "$env:GODOT_EXECUTABLE"
          -AllSmoke
          -TimeoutSeconds 240

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: warn
          retention-days: 14
