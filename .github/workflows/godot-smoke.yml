name: Godot smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-validation:
    name: Browser checks and asset validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install manifest validator dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Materialize visual profile contact sheet
        run: python tools/build_visual_profile_contact_sheet.py

      - name: Run browser checks
        run: npm run check

      - name: Validate clean-checkout runtime assets
        run: npm run validate:runtime-assets

  isolated-smoke:
    name: Isolated Godot smoke
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot 4.7.1
        shell: pwsh
        run: |
          $release = '4.7.1-stable'
          $archive = Join-Path $env:RUNNER_TEMP "Godot_v${release}_win64.exe.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          $url = "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $godot = Get-ChildItem -LiteralPath $destination -Recurse -Filter 'Godot_v4.7.1-stable_win64_console.exe' |
            Select-Object -First 1
          if ($null -eq $godot) {
            throw 'The downloaded Godot archive did not contain the expected Windows console executable.'
          }
          "GODOT_EXECUTABLE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap project global-class cache
        shell: pwsh
        run: |
          # Dialogic's editor plugin is not part of the runtime contract, but
          # Godot loads it during a project import.  The supplied editor assets
          # contain stale UID references in a clean checkout, so disable only
          # editor plugins for this headless class-cache import.  The runtime
          # autoload and every isolated smoke scene keep their normal project
          # configuration.
          $project = 'game/project.godot'
          $content = Get-Content -LiteralPath $project -Raw
          $content = [regex]::Replace($content, '(?m)^enabled=PackedStringArray\([^\r\n]*\)$', 'enabled=PackedStringArray()')
          Set-Content -LiteralPath $project -Value $content -NoNewline -Encoding utf8
          # Godot's first clean-checkout `--headless --import` can wait
          # indefinitely while constructing global_script_class_cache.cfg. Start
          # the editor only long enough to create that cache. Requiring the
          # complete import tree to become idle delays CI on the large tracked
          # asset library; the isolated runner below remains the authority for
          # normal scene imports and smoke execution.
          $bootstrap = Start-Process -FilePath $env:GODOT_EXECUTABLE -ArgumentList @('--headless', '--path', './game', '--editor') -PassThru -NoNewWindow
          $deadline = (Get-Date).AddMinutes(5)
          $cacheReady = $false
          do {
            Start-Sleep -Seconds 2
            $cacheReady = Test-Path -LiteralPath 'game/.godot/global_script_class_cache.cfg' -PathType Leaf
            if ($cacheReady) {
              break
            }
          } while ((Get-Date) -lt $deadline -and -not $bootstrap.HasExited)
          if (-not $bootstrap.HasExited) {
            Stop-Process -Id $bootstrap.Id -Force
            $bootstrap.WaitForExit()
          }
          if (-not $cacheReady) {
            throw 'Godot did not create global_script_class_cache.cfg within 5 minutes.'
          }

      - name: Run isolated smoke suite
        shell: pwsh
        run: >
          ./tools/run_godot_isolated.ps1
          -GodotExecutable "$env:GODOT_EXECUTABLE"
          -AllSmoke
          -TimeoutSeconds 240

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: warn
          retention-days: 14
