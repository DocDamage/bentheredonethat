ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash\nwhile getopts 'd:r:' flag; do\n\tcase \"$flag\" in\n\t\td) REMOTE_DEBUG=$OPTARG ;;\n\t\tr) REMOTE_CMDLINE=$OPTARG ;;\n\tesac\ndone\n\nTMP_DIR=\"/tmp/godot_${RANDOM}\"\nARCHIVE_NAME=\"$(basename \"$REMOTE_CMDLINE\")\"\n\nmkdir -p \"$TMP_DIR\"\nunzip -o -q \"$ARCHIVE_NAME\" -d \"$TMP_DIR\"\n\"$TMP_DIR\"/BenThereDoneThat $REMOTE_DEBUG $REMOTE_CMDLINE\nrm -rf \"$TMP_DIR\"\n"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash\nkill $(pgrep -f BenThereDoneThat)\n"
